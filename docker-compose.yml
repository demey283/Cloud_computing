services:
  mqtt5:
    image: eclipse-mosquitto:2
    container_name: mqtt5
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt5/config:/mosquitto/config:rw
      - ./mqtt5/data:/mosquitto/data:rw
      - ./mqtt5/log:/mosquitto/log:rw
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red:/data
    environment:
      - TZ=Europe/Brussels
    depends_on:
      - mqtt5
    restart: unless-stopped

  weerstation:
    build: ./python
    container_name: weerstation
    environment:
      - MQTT_HOST=mqtt5
      - MQTT_PORT=1883
      - MQTT_TOPIC_PREFIX=weer
      - STATION_ID=kortrijk-01
      - STATION_TZ=Europe/Brussels
      - INTERVAL=2
      - FOUT_KANS=0.15
    depends_on:
      - mqtt5
    restart: unless-stopped

networks:
  default:
    name: mqtt5-network
